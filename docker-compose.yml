# 本地开发用的编排：PostgreSQL + FastAPI 后端 + Next.js 前端，外加一个
# 可选的**一次性初始化服务** init（迁移 + 种子数据 + 知识库，跑完即退出）。
#
# 日常启动（都必须在项目根目录执行）：
#   docker compose up --build        前台启动，Ctrl+C 停止
#   docker compose up --build -d     后台启动
#   docker compose ps                查看服务状态与健康情况
#   docker compose logs -f backend   跟踪某个服务的日志
#   docker compose down              停止并删除容器（数据保留）
#   docker compose down -v           连数据卷一起删除，数据全部丢失，慎用
#
# 干净环境首次搭建（三条命令，顺序明确）：
#   1. docker compose up -d postgres
#   2. docker compose --profile init run --rm init     # 迁移 + 种子 + 知识库
#   3. docker compose up -d backend frontend
# 也可以一条命令拉起全部（init 跑完 backend 才启动）：
#   docker compose --profile init up -d
#
# init 为什么要放在 profile 里：它每次都要连数据库、读文档、可能还要调
# embedding 接口，而日常改代码后的 up 完全不需要重跑。放进 profile 之后，
# 普通 up 不会碰它，需要时才显式启用。重复执行是安全的（幂等）。
#
# 启动顺序不是「一起启动」，而是由健康检查和完成状态串成一条链：
#   postgres healthy → init completed（若启用）→ backend healthy → frontend healthy
# 每一环都等前一环真的可用才继续，避免后端比数据库先起来而连接失败。
#
# 变量取值顺序：shell 环境变量 > 项目根的 .env > 本文件里的默认值。
# 默认值是本地开发用的示例值，真实密码只应写在 .env 中。

# 项目目录名含中文，Compose 会剥掉非 ASCII 字符从而推导出错误的名字（实测会变成 agent），
# 因此这里显式指定。项目名会作为容器名和 volume 名的前缀。
name: data-platform-agent

services:
  # backend 容器通过 Compose 服务名 postgres 直连数据库；
  # 容器内部不能使用 localhost 访问 PostgreSQL。
  postgres:
    # 用 pgvector 官方镜像：RAG 需要 vector 扩展，官方 postgres 镜像不带它
    # （pg_extension 和 pg_available_extensions 里都查不到 vector）。
    # 该 tag 只有 Debian 变体，没有 Alpine 版；PG 大版本仍是 16，数据靠逻辑备份迁移。
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_platform}
      POSTGRES_USER: ${POSTGRES_USER:-data_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_platform_dev}
    ports:
      # 宿主机 5432 -> 容器 5432，本机用 localhost:5432 直连
      - "5432:5432"
    volumes:
      # 具名 volume：容器删了数据还在，只有 down -v 才会清空。
      # 这里挂到新卷 postgres_data_pgvector，让新镜像在空卷上重新 initdb，
      # 避开 Alpine(musl) → Debian(glibc) 的排序规则隐患；
      # 旧的 postgres_data 原样保留，作为回滚点，不删。
      - postgres_data_pgvector:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 返回 0 表示已能接受连接
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_platform} -d ${POSTGRES_DB:-data_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # 首次启动要跑 initdb，给足初始化时间，这段时间内的失败不计入 retries
      start_period: 15s

  # 一次性初始化服务：迁移 → 零售种子数据 → 知识库种子文档。
  #
  # 它是一个**跑完就退出**的容器，不是常驻服务：restart: "no" 保证它不会
  # 失败后无限重启，也不会在后台一直占着。
  #
  # 为什么挂在 "init" profile 下、而不是每次 up 都自动跑：
  # 开发时改一行代码就要 up 一次，每次重跑初始化既慢又没必要。放进 profile 后，
  # 日常 `docker compose up` 只起 postgres + backend + frontend，秒级完成；
  # 需要初始化（首次搭建、或想重建种子数据）时才显式启用。
  #
  # 完整冷启动顺序（三条命令，顺序是明确的）：
  #   docker compose up -d postgres
  #   docker compose --profile init run --rm init
  #   docker compose up -d backend frontend
  #
  # 或者一条命令拉起全部（init 跑完 backend 才启动，见 backend 的 depends_on）：
  #   docker compose --profile init up -d
  #
  # 重复执行是安全的：迁移按 alembic_version 判断、零售数据用
  # ON CONFLICT DO NOTHING、知识切片按内容 hash 跳过未变化的。
  init:
    build:
      # 与 backend 共用同一个镜像：初始化需要的 alembic / scripts /
      # knowledge_seed 都已经在镜像里（见 backend/Dockerfile）。
      context: .
      dockerfile: backend/Dockerfile
    # 不进默认 profile：普通 up 不会启动它
    profiles: ["init"]
    # 一次性任务：跑完即退出，失败也不重启
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 容器内连数据库必须走服务名 postgres，不能用 localhost
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql+asyncpg://data_platform:data_platform_dev@postgres:5432/data_platform}"
      # 知识库导入要用：embedding 是硬性门槛，对话模型只影响元数据质量
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      # auto（默认）：有 embedding 配置就导入，没有就跳过并警告，退出码仍为 0。
      # required：缺配置必须失败，用于真实模式与严格部署检查。
      # skip：明确跳过，用于无 Key 的基础环境。
      INIT_KNOWLEDGE_MODE: ${INIT_KNOWLEDGE_MODE:-auto}
    # 显式写命令，不依赖镜像的 CMD（那个是 uvicorn）：
    # 同一个镜像两种用法，靠这里的 command 区分。
    command: ["python", "scripts/initialize_demo.py"]

  backend:
    build:
      # 构建上下文仍是项目根目录：Dockerfile 里要 COPY 根目录的 requirements.txt
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # 运行模式。real（缺省）走真实的模型与检索链路；demo 把模型、embedding、
      # 精排全部换成确定性替身，一把 Key 都不需要。
      # **缺省值是 real**：这个变量是后加的，缺省必须让没配过它的环境行为完全不变。
      APP_MODE: ${APP_MODE:-real}
      # 模型配置透传给容器。值来自根目录 .env，本文件只给缺省值。
      # 留空也行：健康检查不碰模型，缺 key 不影响后端起不来。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      TEMPERATURE: ${TEMPERATURE:-0.0}
      # RAG 用的 embedding 配置，同样透传。**这几行不能省**：
      # 容器里没有 .env（它在 .dockerignore 里被排除），配置只能靠这里注入。
      # 漏了它们的表现是「本地脚本跑得通、容器里接口 500」——
      # 因为 app/core/config.py 读不到值，require_embedding_settings() 会抛配置错误。
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # RAG 检索增强：查询改写 + 混合检索 + 精排，同样是容器里拿不到的配置。
      # **这几行也不能省**，漏掉的后果比 embedding 那几行更严重：
      # 精排默认是开着的（RAG_RERANK_ENABLED 默认 true），而容器里没有 .env，
      # RERANK_API_KEY 取到空值后 require_rerank_settings() 会抛配置错误，
      # 知识问答接口会直接 500，而不是降级。
      # 两种正确配法：把下面几项填全（真实值写在 .env），
      # 或者显式设 RAG_RERANK_ENABLED=false 关掉精排——关掉时不需要 Key。
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-true}
      RAG_MAX_REWRITTEN_QUERIES: ${RAG_MAX_REWRITTEN_QUERIES:-2}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
      RAG_RETRIEVAL_CANDIDATE_LIMIT: ${RAG_RETRIEVAL_CANDIDATE_LIMIT:-20}
      RAG_FINAL_TOP_K: ${RAG_FINAL_TOP_K:-5}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-dashscope}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      # 密钥与业务空间地址默认留空：真实值只写在 .env 里，本文件只做透传。
      # 地址里带着租户标识，所以这里连示例值都不给。
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-10}
      # 关键：容器内的数据库主机名必须是服务名 postgres。
      # 用 DATABASE_URL_DOCKER（主机名 postgres），不能用 DATABASE_URL
      # （主机名 localhost）——容器里的 localhost 指的是容器自己，不是宿主机。
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql+asyncpg://data_platform:data_platform_dev@postgres:5432/data_platform}"
    depends_on:
      postgres:
        # 等 postgres 健康检查真的通过，而不是只等容器「启动」
        condition: service_healthy
      init:
        # 启用 init profile 时，等一次性初始化真正跑完（迁移 + 种子 + 知识库）
        # 再启动后端，避免后端连上一个还没有表的空库。
        #
        # required: false 是关键：init 属于 "init" profile，普通
        # `docker compose up` 不会启用它。没有这一行，Compose 会因为
        # 「依赖了一个未启用 profile 的服务」直接报错，把现有的日常启动方式弄坏。
        condition: service_completed_successfully
        required: false
    ports:
      # 宿主机 8000 -> 容器 8000
      - "8000:8000"
    healthcheck:
      # 探的是 **readiness**（/api/v1/readiness），不是 liveness（/api/v1/health）。
      #
      # 为什么必须用 readiness：health 只证明「进程活着、数据库连得上」，
      # 而空库上 SELECT 1 照样成功——一个连表都没有的实例会被判成健康，
      # 前端随之启动，然后每个请求都失败。
      # readiness 会额外确认迁移已到 head、必需的表都在、当前模式所需的配置齐备，
      # 未就绪时返回 503，这个容器就不会被当成可用。
      #
      # 代价是：没跑过初始化（init 服务 / scripts/bootstrap.ps1）的库上，
      # 后端会一直不健康，frontend 也起不来。这是刻意的——比绿灯装死好。
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=5); assert response.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 冷启动要 import langchain 那一堆，给它 20 秒不计失败
      start_period: 20s

  frontend:
    build:
      # 上下文同样是项目根目录：Dockerfile 里要 COPY frontend/ 下的源码和锁文件
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        # 后端健康之后前端才启动
        condition: service_healthy
    ports:
      # 宿主机 3000 -> 容器 3000
      - "3000:3000"
    healthcheck:
      # node:24 自带全局 fetch，不用额外装 curl
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  # 旧卷：Alpine 时期的数据。切换后不再挂载，但保留作为回滚点，不删。
  postgres_data:
  # 新卷：pgvector 镜像使用，数据由 pg_dump / pg_restore 逻辑迁移而来。
  postgres_data_pgvector:
