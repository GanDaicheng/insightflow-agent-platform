<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="100" y="100" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="42" font-weight="700" fill="#0f172a">基于RAG的智能问数Agent</text>
  <text x="100" y="145" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#64748b">Agent 将业务问题转成安全 SQL，并用知识库补充指标口径（独立预览，尚未接入页面）</text>
  <rect x="100" y="200" width="1400" height="270" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="140" y="250" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1e40af">Agent 执行链路</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <g fill="#eff6ff" stroke="#3b82f6" stroke-width="2"><rect x="140" y="300" width="180" height="82" rx="16"/><rect x="370" y="300" width="210" height="82" rx="16"/><rect x="630" y="300" width="210" height="82" rx="16"/><rect x="890" y="300" width="210" height="82" rx="16"/><rect x="1150" y="300" width="280" height="82" rx="16" fill="#ecfdf5" stroke="#0f766e"/></g>
    <g font-size="20" font-weight="700" fill="#0f172a"><text x="230" y="340">自然语言问题</text><text x="475" y="340">意图识别 / 资产发现</text><text x="735" y="340">RAG 补充口径</text><text x="995" y="340">SQL 生成</text><text x="1290" y="340">AST 校验 + 只读查询</text></g>
    <g font-size="15" fill="#475569"><text x="230" y="365">趋势 / 排行 / 对比</text><text x="475" y="365">指标、表、字段</text><text x="735" y="365">指标定义 / 业务规则</text><text x="995" y="365">LangChain tool</text><text x="1290" y="365">sqlglot + PostgreSQL</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M320 341h45"/><path d="M580 341h45"/><path d="M840 341h45"/><path d="M1100 341h45"/></g>
  <g fill="#94a3b8"><path d="m359 331 14 10-14 10z"/><path d="m619 331 14 10-14 10z"/><path d="m879 331 14 10-14 10z"/><path d="m1139 331 14 10-14 10z"/></g>
  <rect x="100" y="515" width="1400" height="205" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="140" y="565" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#c2410c">安全闭环与输出</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <g fill="#fff7ed" stroke="#f97316" stroke-width="2"><rect x="170" y="610" width="240" height="70" rx="16"/><rect x="500" y="610" width="240" height="70" rx="16"/><rect x="830" y="610" width="240" height="70" rx="16"/><rect x="1160" y="610" width="240" height="70" rx="16"/></g>
    <g font-size="19" font-weight="700" fill="#0f172a"><text x="290" y="652">校验失败？</text><text x="620" y="652">一次自动修复</text><text x="950" y="652">结果解释</text><text x="1280" y="652">表格 + 图表建议</text></g>
  </g>
  <path d="M290 610 C290 540 720 500 735 382" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M740 645h85" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="m814 635 14 10-14 10z" fill="#94a3b8"/>
  <path d="M1070 645h85" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="m1144 635 14 10-14 10z" fill="#94a3b8"/>
  <text x="100" y="810" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">面试讲解重点：Agent 不是“让模型直接写 SQL”，而是通过工具、RAG、AST 校验和只读事务形成可控执行闭环。</text>
</svg>
