[pytest]
# 统一测试入口：在**项目根目录**执行 `pytest -q`。
#
# 这个文件的作用是让「怎么跑测试」不再依赖调用者的工作目录和 shell 环境。
# 在此之前，测试必须显式带着 `PYTHONPATH=backend` 并从根目录运行，
# 否则要么 import app.* 失败，要么相对路径找不到文件——而这套约束
# 没有任何地方写着，只能靠口口相传。

# 只收集后端测试。
# 前端用的是 vitest（npm run test:unit），是另一套 runner 和断言库，
# 不并进来：混在一起只会让「一次失败到底是哪边的问题」更难判断。
testpaths = backend/tests

# 把 backend/ 放进 sys.path，测试里的 `import app.*` 才能解析。
# 这是 pytest 的内置选项，不需要 conftest.py，也不需要调用方预先设置 PYTHONPATH。
# 路径相对 rootdir（本文件所在目录），所以与执行时的 cwd 无关。
pythonpath = backend

# -r a：结束时汇总所有非通过的用例（失败、跳过、错误）。
# 集成测试在数据库不可用时会整文件跳过，加这一行才不会让「跳过了」被误读成「通过了」。
addopts = -ra
